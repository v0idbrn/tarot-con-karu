<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 400" width="460" height="400" role="img" aria-labelledby="arcanoTitle arcanoDesc">
  <title id="arcanoTitle">Pack Arcano del Año</title>
  <desc id="arcanoDesc">Tres cartas de tarot bajo un arco de fases lunares, junto a una vela intencionada encendida.</desc>

  <defs>
    <radialGradient id="halo" cx="46%" cy="46%" r="52%">
      <stop offset="0" stop-color="#DB9AAD" stop-opacity="0.5" />
      <stop offset="1" stop-color="#DB9AAD" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="backFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C0567B" />
      <stop offset="1" stop-color="#892245" />
    </linearGradient>
    <linearGradient id="cardFace" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FFFDFC" />
      <stop offset="1" stop-color="#F8E7EC" />
    </linearGradient>
    <linearGradient id="sunFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D6879F" />
      <stop offset="1" stop-color="#892245" />
    </linearGradient>
    <linearGradient id="wax" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7E8EC" />
      <stop offset="1" stop-color="#DB9AAD" />
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#C0567B" />
      <stop offset="0.55" stop-color="#F2B879" />
      <stop offset="1" stop-color="#FFF3D6" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFD9A0" stop-opacity="0.75" />
      <stop offset="1" stop-color="#FFD9A0" stop-opacity="0" />
    </radialGradient>
  </defs>

  <circle cx="228" cy="196" r="196" fill="url(#halo)" />

  <!-- arco de fases lunares -->
  <g fill="#C0567B">
    <circle cx="86" cy="128" r="8" opacity="0.9" />
    <path d="M137 78a8 8 0 1 0 0 16 6 8 0 1 1 0-16Z" />
    <path d="M196 56a8 8 0 0 1 0 16Z" opacity="0.85" />
    <circle cx="254" cy="52" r="8" />
    <circle cx="310" cy="66" r="7.5" fill="none" stroke="#C0567B" stroke-width="1.5" />
    <path d="M310 58.5a7.5 7.5 0 0 0 0 15Z" />
    <circle cx="356" cy="98" r="7" fill="none" stroke="#DB9AAD" stroke-width="1.8" />
  </g>

  <!-- carta izquierda (dorso) -->
  <g transform="rotate(-16 118 232)">
    <rect x="62" y="151" width="112" height="162" rx="11" fill="url(#backFace)" />
    <rect x="70" y="159" width="96" height="146" rx="7" fill="none" stroke="#F7E8EC" stroke-opacity="0.4" />
    <circle cx="118" cy="222" r="30" fill="none" stroke="#F7E8EC" stroke-opacity="0.3" />
    <path d="M118 205a17 17 0 1 0 0 34 13 17 0 1 1 0-34Z" fill="#F7E8EC" opacity="0.9" />
    <path d="M98 276h40" stroke="#F7E8EC" stroke-opacity="0.45" stroke-linecap="round" />
    <path d="M108 286h20" stroke="#F7E8EC" stroke-opacity="0.3" stroke-linecap="round" />
  </g>

  <!-- carta derecha -->
  <g transform="rotate(15 342 232)">
    <rect x="286" y="151" width="112" height="162" rx="11" fill="url(#cardFace)" stroke="#D6879F" stroke-width="1.2" />
    <rect x="294" y="159" width="96" height="146" rx="7" fill="none" stroke="#DB9AAD" stroke-opacity="0.7" />
    <circle cx="342" cy="210" r="15" fill="none" stroke="#C0567B" stroke-width="1.2" />
    <circle cx="342" cy="210" r="4" fill="#892245" />
    <path d="M326 248l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2Z" fill="#C0567B" />
    <path d="M358 248l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2Z" fill="#C0567B" />
    <path d="M317 278h50" stroke="#DB9AAD" stroke-linecap="round" />
  </g>

  <!-- carta central -->
  <g>
    <ellipse cx="230" cy="332" rx="80" ry="9" fill="#892245" opacity="0.08" />
    <rect x="172" y="163" width="116" height="172" rx="12" fill="url(#cardFace)" stroke="#DB9AAD" stroke-width="1.3" />
    <rect x="180" y="171" width="100" height="156" rx="8" fill="none" stroke="#D6879F" stroke-opacity="0.55" />
    <g transform="translate(230 226)" stroke="#C0567B" stroke-width="1.5" stroke-linecap="round">
      <path d="M27 0h8" />
      <path d="M23.4 13.5l6.9 4" />
      <path d="M13.5 23.4l4 6.9" />
      <path d="M0 27v8" />
      <path d="M-13.5 23.4l-4 6.9" />
      <path d="M-23.4 13.5l-6.9 4" />
      <path d="M-27 0h-8" />
      <path d="M-23.4 -13.5l-6.9 -4" />
      <path d="M-13.5 -23.4l-4 -6.9" />
      <path d="M0 -27v-8" />
      <path d="M13.5 -23.4l4 -6.9" />
      <path d="M23.4 -13.5l6.9 -4" />
    </g>
    <circle cx="230" cy="226" r="19" fill="url(#sunFill)" />
    <path d="M203 276h54" stroke="#C0567B" stroke-opacity="0.35" stroke-linecap="round" />
    <path d="M213 288h34" stroke="#DB9AAD" stroke-linecap="round" />
    <path d="M230 303l1.1 3 3 1.1-3 1.1-1.1 3-1.1-3-3-1.1 3-1.1 1.1-3Z" fill="#D6879F" />
  </g>

  <!-- vela intencionada -->
  <circle cx="384" cy="254" r="48" fill="url(#glow)" />
  <g>
    <ellipse cx="384" cy="336" rx="32" ry="6" fill="#892245" opacity="0.07" />
    <rect x="356" y="252" width="56" height="82" rx="9" fill="url(#wax)" stroke="#D6879F" stroke-opacity="0.65" />
    <path d="M356 268h56" stroke="#FFFDFC" stroke-opacity="0.7" />
    <text x="384" y="308" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#892245" opacity="0.75">vela</text>
    <path d="M384 240c6 4 9 9 9 14a9 9 0 1 1-18 0c0-5 3-10 9-14Z" fill="url(#flame)" />
    <path d="M384 249c3 3 4 6 4 8.5a4 4 0 1 1-8 0c0-2.5 1-5.5 4-8.5Z" fill="#FFF3D6" opacity="0.9" />
  </g>

  <!-- destellos -->
  <path d="M62 92l1.3 3.4 3.4 1.3-3.4 1.3-1.3 3.4-1.3-3.4-3.4-1.3 3.4-1.3 1.3-3.4Z" fill="#D6879F" />
  <path d="M300 118l1 2.6 2.6 1-2.6 1-1 2.6-1-2.6-2.6-1 2.6-1 1-2.6Z" fill="#C0567B" opacity="0.65" />
  <path d="M424 176l1.1 2.9 2.9 1.1-2.9 1.1-1.1 2.9-1.1-2.9-2.9-1.1 2.9-1.1 1.1-2.9Z" fill="#D6879F" opacity="0.8" />
  <path d="M150 348l1 2.6 2.6 1-2.6 1-1 2.6-1-2.6-2.6-1 2.6-1 1-2.6Z" fill="#C0567B" opacity="0.5" />
  <path d="M64 288l.9 2.4 2.4.9-2.4.9-.9 2.4-.9-2.4-2.4-.9 2.4-.9.9-2.4Z" fill="#DB9AAD" />
</svg>
